<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>파이썬 완전 정복 — 기초부터 코딩테스트·실무·ROS 2까지</title>
<link rel="stylesheet" href="assets/style.css?v=ed8dd14e72">
<!-- 파비콘: 픽셀 아트 로봇 머리. 외부 요청 없이 인라인 SVG 로 그린다. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%2310151b'/><rect x='6' y='0' width='4' height='2' fill='%234fd3c4'/><rect x='7' y='1' width='2' height='3' fill='%23f2b23e'/><rect x='0' y='6' width='2' height='4' fill='%23f2b23e'/><rect x='14' y='6' width='2' height='4' fill='%23f2b23e'/><rect x='2' y='4' width='12' height='9' fill='%23f2b23e'/><rect x='4' y='6' width='8' height='4' fill='%2310151b'/><rect x='5' y='7' width='2' height='2' fill='%234fd3c4'/><rect x='9' y='7' width='2' height='2' fill='%234fd3c4'/><rect x='5' y='11' width='6' height='1' fill='%2310151b'/></svg>">
</head>
<body>

<div id="app-loading">불러오는 중…</div>

<header id="topbar">
  <button id="btn-menu" class="icon-btn" aria-label="목차 열기" title="목차 (Esc)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a href="#/" id="brand">
    <span class="brand-mark" aria-hidden="true">
      <!-- 인라인 SVG 라서 CSS 변수를 그대로 받는다 — 테마 전환 시 색도 같이 바뀐다. -->
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="6" y="0" width="4" height="2" fill="var(--accent-2)"/>
        <rect x="7" y="1" width="2" height="3" fill="var(--accent)"/>
        <rect x="0" y="6" width="2" height="4" fill="var(--accent)"/>
        <rect x="14" y="6" width="2" height="4" fill="var(--accent)"/>
        <rect x="2" y="4" width="12" height="9" fill="var(--accent)"/>
        <rect x="4" y="6" width="8" height="4" fill="var(--ink)"/>
        <rect x="5" y="7" width="2" height="2" fill="var(--accent-2)"/>
        <rect x="9" y="7" width="2" height="2" fill="var(--accent-2)"/>
        <rect x="5" y="11" width="6" height="1" fill="var(--ink)"/>
      </svg>
    </span>
    <span class="brand-text">파이썬 완전 정복</span>
  </a>
  <div class="topbar-spacer"></div>
  <button id="btn-search" class="icon-btn" aria-label="검색" title="검색 (/)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.35-4.35"/></svg>
  </button>
  <button id="btn-font" class="icon-btn" aria-label="글자 크기" title="글자 크기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l6-14 6 14M6.5 14h7"/><path d="M16 19l4-9 4 9M17.4 16.5h5.2" transform="scale(.72) translate(6 5)"/></svg>
  </button>
  <button id="btn-theme" class="icon-btn" aria-label="테마 전환" title="테마 전환">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
  </button>
</header>

<div id="scrollbar-progress"><div id="scrollbar-progress-fill"></div></div>

<div id="layout">
  <nav id="sidebar" aria-label="목차">
    <div id="sidebar-head">
      <div id="progress-summary">
        <div class="ps-ring">
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <circle class="ps-bg" cx="18" cy="18" r="15.9"/>
            <circle class="ps-fg" cx="18" cy="18" r="15.9"/>
          </svg>
          <span id="ps-pct">0%</span>
        </div>
        <div class="ps-text">
          <strong id="ps-title">탐험 진행도</strong>
          <small id="ps-sub">0 / 0 절 완료</small>
        </div>
      </div>
      <input id="toc-filter" type="search" placeholder="목차에서 거르기…" autocomplete="off" spellcheck="false">
    </div>
    <div id="toc"></div>
    <!-- 장식용 픽셀 지면. 목차 아래에 늘 보인다. 내용이 없으므로 접근성 트리에서 숨긴다. -->
    <div id="pixel-field" aria-hidden="true">
      <i class="spr pf-sapling"></i><i class="spr pf-tree"></i><i class="spr pf-grass"></i><i class="spr pf-rock"></i>
      <i class="spr pf-flower"></i><i class="spr pf-bush"></i><i class="spr pf-mushroom"></i>
      <i class="spr pf-slime"></i><i class="spr pf-robot"></i>
    </div>
    <div id="sidebar-foot">
      <button id="btn-reset" class="text-btn">진도 초기화</button>
    </div>
  </nav>
  <div id="scrim"></div>

  <main id="main">
    <article id="content"></article>
    <nav id="pager" aria-label="이전/다음"></nav>
    <footer id="page-foot">
      <span>파이썬 완전 정복 · 나만의 가이드북</span>
    </footer>
  </main>

  <aside id="outline" aria-label="이 페이지 내용">
    <div class="outline-title">이 페이지</div>
    <div id="outline-list"></div>
  </aside>
</div>

<div id="search-overlay" hidden>
  <div id="search-panel" role="dialog" aria-modal="true" aria-label="전체 검색">
    <div id="search-bar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.35-4.35"/></svg>
      <input id="search-input" type="search" placeholder="전체 본문 검색 (예: 데코레이터, asyncio, 다익스트라)" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div id="search-results"></div>
    <div id="search-foot"><kbd>↑</kbd><kbd>↓</kbd> 이동 · <kbd>Enter</kbd> 열기</div>
  </div>
</div>

<script src="assets/highlight.js?v=ed8dd14e72"></script>
<script src="assets/markdown.js?v=ed8dd14e72"></script>
<script src="assets/bundle.js?v=ed8dd14e72"></script>
<script src="assets/game.js?v=ed8dd14e72"></script>
<script src="assets/app.js?v=ed8dd14e72"></script>
</body>
</html>
